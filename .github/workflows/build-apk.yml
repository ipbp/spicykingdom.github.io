name: Build Auto-Updating Spicy Kingdom POS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Capacitor Live-URL Wrapper & Build APK
        run: |
          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          npx cap init "Spicy Kingdom POS" "com.spicykingdom.pos" --web-dir www

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.spicykingdom.pos",
            "appName": "Spicy Kingdom POS",
            "webDir": "www",
            "server": {
              "url": "https://ipbp.github.io/spicykingdom.github.io/",
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android

          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android || true
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java")
          if [ -n "$MAIN_ACT" ]; then
            sed -i 's/super.onCreate(savedInstanceState);/super.onCreate(savedInstanceState); getWindow().setStatusBarColor(android.graphics.Color.parseColor("#E11D48"));/' "$MAIN_ACT"
          fi

          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Spicy Kingdom POS APK
        uses: actions/upload-artifact@v4
        with:
          name: Spicy-Kingdom-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
